# Cabeceras de seguridad para AWS Amplify (se aplican a todo el sitio).
# El CSP no se incluye aquí a propósito: debe armarse con los dominios reales
# (API, Google Maps, fuentes) y probarse primero en modo Report-Only.
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self)
